name: Build and deploy Aseprite

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even if this Aseprite version is already cached"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

permissions:
  contents: write

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      version_info: ${{ steps.version_info.outputs.version_info }}
      should_build: ${{ steps.should_build.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release information
        id: version_info
        shell: bash
        run: |
          set -euo pipefail

          data="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aseprite/aseprite/releases/latest")"

          latest_tag="$(echo "$data" | jq -r '.tag_name')"
          version_info="$(echo "$data" | jq -r '.body')"

          {
            echo "latest_tag=$latest_tag"
            echo "version_info<<EOF"
            echo "$version_info"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already built
        id: version_check
        uses: actions/cache@v5
        with:
          path: latest-version.txt
          key: aseprite-version-${{ steps.version_info.outputs.latest_tag }}

      - name: Decide whether to build
        id: should_build
        shell: bash
        run: |
          force_build="${{ inputs.force_build }}"

          if [[ "$force_build" == "true" ]]; then
            echo "A forced build was requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"

          elif [[ "${{ steps.version_check.outputs.cache-hit }}" == "true" ]]; then
            echo "Aseprite ${{ steps.version_info.outputs.latest_tag }} was already built."
            echo "should_build=false" >> "$GITHUB_OUTPUT"

          else
            echo "A new Aseprite release was found."
            echo "${{ steps.version_info.outputs.latest_tag }}" > latest-version.txt
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-aseprite:
    name: Build Aseprite
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest

    steps:
      - name: Windows - Install Ninja
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "$env:RUNNER_TEMP\ninja"
          $zipPath = "$env:RUNNER_TEMP\ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v${env:NINJA_VERSION}/ninja-win.zip"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installDir |
            Out-Null

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zipPath

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $installDir `
            -Force

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $installDir

          & "$installDir\ninja.exe" --version

      - name: Ubuntu - Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            p7zip-full

      - name: macOS - Install dependencies
        if: matrix.os == 'macOS-latest'
        run: |
          brew install ninja p7zip

      - name: Get Skia from cache
        id: skia_cache
        uses: actions/cache@v5
        with:
          path: skia
          key: skia-${{ runner.os }}-m81-b607b32047

      - name: Download Skia if it is not cached
        if: steps.skia_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaFile = "Skia-${env:RUNNER_OS}-Release-X64.zip"
          $skiaUrl = "https://github.com/aseprite/skia/releases/download/m81-b607b32047/$skiaFile"

          Invoke-WebRequest `
            -Uri $skiaUrl `
            -OutFile $skiaFile

          New-Item `
            -ItemType Directory `
            -Force `
            -Path skia |
            Out-Null

          7z x `
            $skiaFile `
            "-oskia" `
            -y |
            Out-Null

      - name: Download Aseprite source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.check-version.outputs.latest_tag }}"
          $sourceUrl = "https://github.com/aseprite/aseprite/archive/refs/tags/$tag.zip"

          $zipFile = Join-Path `
            $env:RUNNER_TEMP `
            "Aseprite-source.zip"

          $extractDir = Join-Path `
            $env:RUNNER_TEMP `
            "aseprite-extracted"

          $destinationDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "aseprite"

          if (Test-Path $extractDir) {
            Remove-Item `
              $extractDir `
              -Recurse `
              -Force
          }

          if (Test-Path $destinationDir) {
            Remove-Item `
              $destinationDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractDir `
            -Force |
            Out-Null

          Invoke-WebRequest `
            -Uri $sourceUrl `
            -OutFile $zipFile

          7z x `
            $zipFile `
            "-o$extractDir" `
            -y |
            Out-Null

          $sourceDirectory = Get-ChildItem `
            -Path $extractDir `
            -Directory |
            Select-Object -First 1

          if ($null -eq $sourceDirectory) {
            throw "Could not find the extracted Aseprite source directory."
          }

          Move-Item `
            -Path $sourceDirectory.FullName `
            -Destination $destinationDir

          New-Item `
            -ItemType Directory `
            -Path "$destinationDir\build" `
            -Force |
            Out-Null

          Write-Host "Aseprite source directory: $destinationDir"

      - name: Windows - Configure and build
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          cd aseprite\build

          cmake ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/" ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=../../skia ^
            -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 ^
            -G Ninja ..

          ninja aseprite

      - name: Ubuntu - Configure and build
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cmake \
            -S aseprite \
            -B aseprite/build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$GITHUB_WORKSPACE/skia" \
            -DSKIA_LIBRARY_DIR="$GITHUB_WORKSPACE/skia/out/Release-x64" \
            -G Ninja

          cmake \
            --build aseprite/build \
            --target aseprite \
            --config "$BUILD_TYPE"

      - name: macOS - Configure and build
        if: matrix.os == 'macOS-latest'
        shell: bash
        run: |
          cmake \
            -S aseprite \
            -B aseprite/build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$GITHUB_WORKSPACE/skia" \
            -DSKIA_LIBRARY_DIR="$GITHUB_WORKSPACE/skia/out/Release-x64" \
            -G Ninja

          cmake \
            --build aseprite/build \
            --target aseprite \
            --config "$BUILD_TYPE"

      - name: Clean build directory
        shell: pwsh
        run: |
          $binPath = "aseprite/build/bin"

          $filesToRemove = @(
            "gen",
            "modp_b64_gen",
            "gen.exe",
            "gen.exe.manifest",
            "modp_b64_gen.exe",
            "modp_b64_gen.exe.manifest"
          )

          foreach ($file in $filesToRemove) {
            $filePath = Join-Path $binPath $file

            if (Test-Path $filePath) {
              Remove-Item `
                $filePath `
                -Force
            }
          }

      - name: Windows - Make portable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Content `
            -Path "aseprite/build/bin/aseprite.ini" `
            -Value "# This file is here so Aseprite behaves as a portable program"

      - name: Create release archive
        shell: pwsh
        run: |
          $tag = "${{ needs.check-version.outputs.latest_tag }}"
          $archive = "Aseprite-$tag-${env:RUNNER_OS}.zip"

          7z a `
            "aseprite/build/bin/$archive" `
            "aseprite/build/bin/*"

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.check-version.outputs.latest_tag }}"

          cat > release-notes.md <<'EOF'
          ${{ needs.check-version.outputs.version_info }}
          EOF

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Release Aseprite $tag" \
            --notes-file release-notes.md

      - name: Upload release archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.check-version.outputs.latest_tag }}"
          archive="aseprite/build/bin/Aseprite-$tag-${RUNNER_OS}.zip"

          gh release upload "$tag" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
