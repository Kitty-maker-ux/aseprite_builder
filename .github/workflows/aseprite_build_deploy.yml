name: Build and deploy Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

  # These versions must remain compatible.
  ASEPRITE_TAG: "v1.2.40"
  SKIA_VERSION: "m81-b607b32047"
  SKIA_ARCHIVE: "Skia-Windows-Release-X64.zip"

permissions:
  contents: write

jobs:
  build-aseprite:
    name: Build Aseprite for Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "$env:RUNNER_TEMP\ninja"
          $zipPath = "$env:RUNNER_TEMP\ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 300 `
            --output "$zipPath" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja download failed."
          }

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $installDir `
            -Force

          if (-not (Test-Path -LiteralPath "$installDir\ninja.exe")) {
            throw "ninja.exe was not found."
          }

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $installDir

          & "$installDir\ninja.exe" --version

      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ env.ASEPRITE_TAG }}
          path: aseprite
          submodules: recursive
          fetch-depth: 1

      - name: Verify source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "aseprite"
          $cmakeFile = Join-Path $sourceDir "CMakeLists.txt"

          if (-not (Test-Path -LiteralPath $sourceDir)) {
            throw "Aseprite source directory was not found: $sourceDir"
          }

          if (-not (Test-Path -LiteralPath $cmakeFile)) {
            throw "Aseprite CMakeLists.txt was not found: $cmakeFile"
          }

          Write-Host "Aseprite source directory verified:"
          Write-Host $sourceDir

      - name: Download and verify Skia
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaRoot = Join-Path $env:GITHUB_WORKSPACE "skia"
          $archive = Join-Path $env:RUNNER_TEMP $env:SKIA_ARCHIVE
          $url = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/$env:SKIA_ARCHIVE"

          if (Test-Path -LiteralPath $skiaRoot) {
            Remove-Item `
              -LiteralPath $skiaRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $skiaRoot `
            -Force |
            Out-Null

          Write-Host "Downloading Skia from:"
          Write-Host $url

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 900 `
            --output "$archive" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Skia download failed."
          }

          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Skia archive was not downloaded."
          }

          Write-Host "Skia archive contents:"
          7z l "$archive"

          7z x "$archive" "-o$skiaRoot" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Skia archive extraction failed."
          }

          # Handle archives containing a nested skia directory.
          $nestedRoot = Join-Path $skiaRoot "skia"
          $nestedInclude = Join-Path $nestedRoot "include"
          $nestedOutput = Join-Path $nestedRoot "out"

          if (
            (Test-Path -LiteralPath $nestedInclude) -and
            (Test-Path -LiteralPath $nestedOutput)
          ) {
            Get-ChildItem `
              -LiteralPath $nestedRoot `
              -Force |
              Move-Item `
                -Destination $skiaRoot `
                -Force

            Remove-Item `
              -LiteralPath $nestedRoot `
              -Recurse `
              -Force
          }

          $requiredPaths = @(
            (Join-Path $skiaRoot "include"),
            (Join-Path $skiaRoot "out\Release-x64"),
            (Join-Path $skiaRoot "out\Release-x64\skia.lib"),
            (Join-Path $skiaRoot "third_party\externals")
          )

          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Required Skia path is missing: $requiredPath"
            }
          }

          Write-Host "Skia installation verified."
          Get-Item `
            -LiteralPath (Join-Path $skiaRoot "out\Release-x64\skia.lib")

      - name: Configure Aseprite
        shell: cmd
        run: |
          @echo on
          setlocal EnableExtensions EnableDelayedExpansion

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          echo Using Visual Studio installation:
          echo !VSINSTALL!

          call "!VSINSTALL!\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize the Visual Studio developer environment.
            exit /b 1
          )

          where cl
          if errorlevel 1 exit /b 1

          where link
          if errorlevel 1 exit /b 1

          where cmake
          if errorlevel 1 exit /b 1

          where ninja
          if errorlevel 1 exit /b 1

          if not exist "%GITHUB_WORKSPACE%\aseprite\CMakeLists.txt" (
            echo Aseprite CMakeLists.txt was not found.
            exit /b 1
          )

          if not exist "%GITHUB_WORKSPACE%\skia\include" (
            echo Skia include directory was not found.
            exit /b 1
          )

          if not exist "%GITHUB_WORKSPACE%\skia\out\Release-x64\skia.lib" (
            echo Skia library was not found.
            exit /b 1
          )

          if exist "%GITHUB_WORKSPACE%\aseprite\build" (
            rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build"
          )

          cmake ^
            -S "%GITHUB_WORKSPACE%\aseprite" ^
            -B "%GITHUB_WORKSPACE%\aseprite\build" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DLAF_BACKEND=skia ^
            -DENABLE_CCACHE=OFF ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64" ^
            -DSKIA_LIBRARY="%GITHUB_WORKSPACE%\skia\out\Release-x64\skia.lib" ^
            -Wno-dev ^
            --log-level=VERBOSE

          if errorlevel 1 (
            echo.
            echo CMake configuration failed.

            if exist "%GITHUB_WORKSPACE%\aseprite\build\CMakeFiles\CMakeError.log" (
              echo.
              echo ===== CMakeError.log =====
              type "%GITHUB_WORKSPACE%\aseprite\build\CMakeFiles\CMakeError.log"
            )

            if exist "%GITHUB_WORKSPACE%\aseprite\build\CMakeFiles\CMakeOutput.log" (
              echo.
              echo ===== CMakeOutput.log =====
              type "%GITHUB_WORKSPACE%\aseprite\build\CMakeFiles\CMakeOutput.log"
            )

            exit /b 1
          )

          endlocal

      - name: Upload CMake diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-diagnostics
          path: |
            aseprite/build
            skia
          if-no-files-found: warn
          compression-level: 6

      - name: Build Aseprite
        shell: cmd
        run: |
          @echo on
          setlocal EnableExtensions EnableDelayedExpansion

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          call "!VSINSTALL!\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize the Visual Studio developer environment.
            exit /b 1
          )

          where cl
          if errorlevel 1 exit /b 1

          where link
          if errorlevel 1 exit /b 1

          where cmake
          if errorlevel 1 exit /b 1

          where ninja
          if errorlevel 1 exit /b 1

          if not exist "%GITHUB_WORKSPACE%\aseprite\build\build.ninja" (
            echo CMake build files were not generated.
            exit /b 1
          )

          cmake ^
            --build "%GITHUB_WORKSPACE%\aseprite\build" ^
            --target aseprite ^
            --parallel 2 ^
            --verbose

          if errorlevel 1 (
            echo Aseprite build failed.
            exit /b 1
          )

          endlocal

      - name: Create portable configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binDirectory = Join-Path $env:GITHUB_WORKSPACE "aseprite\build\bin"
          $iniPath = Join-Path $binDirectory "aseprite.ini"

          if (-not (Test-Path -LiteralPath $binDirectory)) {
            throw "Aseprite bin directory was not created: $binDirectory"
          }

          Set-Content `
            -LiteralPath $iniPath `
            -Value "# Portable Aseprite configuration" `
            -Encoding UTF8

          if (-not (Test-Path -LiteralPath $iniPath)) {
            throw "Portable configuration file was not created."
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executable = Join-Path $env:GITHUB_WORKSPACE "aseprite\build\bin\aseprite.exe"

          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Aseprite executable was not created: $executable"
          }

          Write-Host "Verified executable:"
          Write-Host $executable

      - name: Create archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binDirectory = Join-Path $env:GITHUB_WORKSPACE "aseprite\build\bin"
          $archiveName = "Aseprite-$env:ASEPRITE_TAG-Windows.zip"
          $archivePath = Join-Path $binDirectory $archiveName
          $stagingDirectory = Join-Path $env:RUNNER_TEMP "aseprite-release"

          if (-not (Test-Path -LiteralPath $binDirectory)) {
            throw "Aseprite bin directory was not found: $binDirectory"
          }

          if (Test-Path -LiteralPath $stagingDirectory) {
            Remove-Item `
              -LiteralPath $stagingDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stagingDirectory `
            -Force |
            Out-Null

          Get-ChildItem `
            -LiteralPath $binDirectory `
            -File |
            Where-Object {
              $_.Name -ne $archiveName
            } |
            Copy-Item `
              -Destination $stagingDirectory `
              -Force

          if (Test-Path -LiteralPath $archivePath) {
            Remove-Item `
              -LiteralPath $archivePath `
              -Force
          }

          7z a `
            "$archivePath" `
            "$stagingDirectory\*" `
            -mx=5

          if ($LASTEXITCODE -ne 0) {
            throw "Release archive creation failed."
          }

          if (-not (Test-Path -LiteralPath $archivePath)) {
            throw "Release archive was not created."
          }

          Write-Host "Created release archive:"
          Write-Host $archivePath

      - name: Upload Aseprite artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: aseprite/build/bin/Aseprite-${{ env.ASEPRITE_TAG }}-Windows.zip
          if-no-files-found: error
          compression-level: 0
