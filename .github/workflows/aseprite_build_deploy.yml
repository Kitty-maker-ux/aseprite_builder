name: Build and deploy Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

permissions:
  contents: write

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      version_info: ${{ steps.version_info.outputs.version_info }}

    steps:
      - name: Get latest Aseprite release information
        id: version_info
        shell: bash
        run: |
          set -euo pipefail

          data="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aseprite/aseprite/releases/latest")"

          latest_tag="$(echo "$data" | jq -r '.tag_name')"
          version_info="$(echo "$data" | jq -r '.body')"

          {
            echo "latest_tag=$latest_tag"
            echo "version_info<<EOF"
            echo "$version_info"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-aseprite:
    name: Build Aseprite for Windows
    needs: check-version
    runs-on: windows-latest

    steps:
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "$env:RUNNER_TEMP\ninja"
          $zipPath = "$env:RUNNER_TEMP\ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v${env:NINJA_VERSION}/ninja-win.zip"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installDir |
            Out-Null

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zipPath

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $installDir `
            -Force

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $installDir

          & "$installDir\ninja.exe" --version

      - name: Restore Skia cache
        id: skia_cache
        uses: actions/cache@v5
        with:
          path: skia
          key: skia-windows-m81-b607b32047

      - name: Download and verify Skia
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaFile = "Skia-Windows-Release-X64.zip"
          $skiaUrl = "https://github.com/aseprite/skia/releases/download/m81-b607b32047/$skiaFile"

          if ("${{ steps.skia_cache.outputs.cache-hit }}" -eq "true") {
            Write-Host "Skia was restored from cache."
          }
          else {
            Invoke-WebRequest `
              -Uri $skiaUrl `
              -OutFile $skiaFile

            New-Item `
              -ItemType Directory `
              -Force `
              -Path skia |
              Out-Null

            7z x `
              $skiaFile `
              "-oskia" `
              -y |
              Out-Null
          }

          if (-not (Test-Path "skia")) {
            throw "The Skia directory was not found."
          }

          if (-not (Test-Path "skia\out\Release-x64")) {
            throw "The Skia library directory was not found: skia\out\Release-x64"
          }

          if (-not (Test-Path "skia\include")) {
            throw "The Skia include directory was not found: skia\include"
          }

          Write-Host "Skia installation verified."

      - name: Download Aseprite source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.check-version.outputs.latest_tag }}"
          $sourceUrl = "https://github.com/aseprite/aseprite/archive/refs/tags/$tag.zip"

          $zipFile = Join-Path `
            $env:RUNNER_TEMP `
            "Aseprite-source.zip"

          $extractDir = Join-Path `
            $env:RUNNER_TEMP `
            "aseprite-extracted"

          $destinationDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "aseprite"

          if (Test-Path $extractDir) {
            Remove-Item `
              $extractDir `
              -Recurse `
              -Force
          }

          if (Test-Path $destinationDir) {
            Remove-Item `
              $destinationDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractDir `
            -Force |
            Out-Null

          Invoke-WebRequest `
            -Uri $sourceUrl `
            -OutFile $zipFile

          7z x `
            $zipFile `
            "-o$extractDir" `
            -y |
            Out-Null

          $sourceDirectory = Get-ChildItem `
            -Path $extractDir `
            -Directory |
            Select-Object -First 1

          if ($null -eq $sourceDirectory) {
            throw "Could not find the extracted Aseprite source directory."
          }

          Move-Item `
            -Path $sourceDirectory.FullName `
            -Destination $destinationDir

          New-Item `
            -ItemType Directory `
            -Path "$destinationDir\build" `
            -Force |
            Out-Null

          Write-Host "Aseprite source directory: $destinationDir"

      - name: Configure and build Aseprite
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo A Visual Studio installation with C++ tools was not found.
            exit /b 1
          )

          echo Using Visual Studio installation:
          echo %VSINSTALL%

          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize the Visual Studio developer environment.
            exit /b 1
          )

          where cl

          if errorlevel 1 (
            echo MSVC compiler was not found.
            exit /b 1
          )

          where cmake

          if errorlevel 1 (
            echo CMake was not found.
            exit /b 1
          )

          where ninja

          if errorlevel 1 (
            echo Ninja was not found.
            exit /b 1
          )

          if exist "%GITHUB_WORKSPACE%\aseprite\build\CMakeCache.txt" (
            del /f /q "%GITHUB_WORKSPACE%\aseprite\build\CMakeCache.txt"
          )

          if exist "%GITHUB_WORKSPACE%\aseprite\build\CMakeFiles" (
            rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build\CMakeFiles"
          )

          cmake ^
            -S "%GITHUB_WORKSPACE%\aseprite" ^
            -B "%GITHUB_WORKSPACE%\aseprite\build" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/" ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64"

          if errorlevel 1 (
            echo CMake configuration failed.
            exit /b 1
          )

          if not exist "%GITHUB_WORKSPACE%\aseprite\build\build.ninja" (
            echo CMake did not create build.ninja.
            exit /b 1
          )

          cmake ^
            --build "%GITHUB_WORKSPACE%\aseprite\build" ^
            --target aseprite ^
            --config %BUILD_TYPE% ^
            --parallel

          if errorlevel 1 (
            echo Aseprite build failed.
            exit /b 1
          )

      - name: Clean build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binPath = "aseprite\build\bin"

          $filesToRemove = @(
            "gen",
            "modp_b64_gen",
            "gen.exe",
            "gen.exe.manifest",
            "modp_b64_gen.exe",
            "modp_b64_gen.exe.manifest"
          )

          foreach ($file in $filesToRemove) {
            $filePath = Join-Path $binPath $file

            if (Test-Path $filePath) {
              Remove-Item `
                $filePath `
                -Force
            }
          }

      - name: Make Aseprite portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Content `
            -Path "aseprite\build\bin\aseprite.ini" `
            -Value "# This file is here so Aseprite behaves as a portable program"

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $asepriteExecutable = "aseprite\build\bin\aseprite.exe"

          if (-not (Test-Path $asepriteExecutable)) {
            throw "Aseprite executable was not found at $asepriteExecutable"
          }

          Write-Host "Build output verified: $asepriteExecutable"

      - name: Create release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.check-version.outputs.latest_tag }}"
          $archive = "Aseprite-$tag-Windows.zip"
          $archivePath = "aseprite\build\bin\$archive"

          if (Test-Path $archivePath) {
            Remove-Item `
              $archivePath `
              -Force
          }

          7z a `
            $archivePath `
            "aseprite\build\bin\*"

          if (-not (Test-Path $archivePath)) {
            throw "Release archive was not created."
          }

          Write-Host "Created release archive: $archivePath"

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ needs.check-version.outputs.latest_tag }}"

          cat > release-notes.md <<'EOF'
          ${{ needs.check-version.outputs.version_info }}
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Release Aseprite $tag" \
              --notes-file release-notes.md
          fi

      - name: Upload release archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ needs.check-version.outputs.latest_tag }}"
          archive="aseprite/build/bin/Aseprite-$tag-Windows.zip"

          if [ ! -f "$archive" ]; then
            echo "Release archive not found: $archive"
            exit 1
          fi

          gh release upload "$tag" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
