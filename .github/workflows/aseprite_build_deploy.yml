name: Build and deploy Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

  # These versions must remain compatible.
  ASEPRITE_TAG: "v1.2.40"
  SKIA_VERSION: "m81-b607b32047"
  SKIA_ARCHIVE: "Skia-Windows-Release-X64.zip"

permissions:
  contents: write

jobs:
  build-aseprite:
    name: Build Aseprite for Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "$env:RUNNER_TEMP\ninja"
          $zipPath = "$env:RUNNER_TEMP\ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 300 `
            --output "$zipPath" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja download failed."
          }

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $installDir `
            -Force

          if (-not (Test-Path "$installDir\ninja.exe")) {
            throw "ninja.exe was not found."
          }

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $installDir

          & "$installDir\ninja.exe" --version

      - name: Download and verify Skia
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaRoot = "$env:GITHUB_WORKSPACE\skia"
          $archive = "$env:RUNNER_TEMP\$env:SKIA_ARCHIVE"
          $url = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/$env:SKIA_ARCHIVE"

          if (Test-Path $skiaRoot) {
            Remove-Item `
              -Path $skiaRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $skiaRoot `
            -Force |
            Out-Null

          Write-Host "Downloading Skia from:"
          Write-Host $url

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 900 `
            --output "$archive" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Skia download failed."
          }

          Write-Host "Skia archive contents:"
          7z l "$archive"

          7z x "$archive" "-o$skiaRoot" -y | Out-Null

          # Handle archives containing a nested skia directory.
          $nestedRoot = "$skiaRoot\skia"

          if (
            (Test-Path "$nestedRoot\include") -and
            (Test-Path "$nestedRoot\out")
          ) {
            Get-ChildItem `
              -Path $nestedRoot `
              -Force |
              Move-Item `
                -Destination $skiaRoot `
                -Force

            Remove-Item `
              -Path $nestedRoot `
              -Recurse `
              -Force
          }

          $requiredPaths = @(
            "$skiaRoot\include",
            "$skiaRoot\out\Release-x64",
            "$skiaRoot\out\Release-x64\skia.lib",
            "$skiaRoot\third_party\externals"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Required Skia path is missing: $path"
            }
          }

          Write-Host "Skia installation verified."

      - name: Remove missing Skia include paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaRoot = "$env:GITHUB_WORKSPACE\skia"
          $missingPath = "$skiaRoot\third_party\externals\libjpeg-turbo"

          $files = Get-ChildItem `
            -Path $skiaRoot `
            -Recurse `
            -File `
            -Include "*.cmake", "*.txt"

          foreach ($file in $files) {
            $content = Get-Content `
              -Path $file.FullName `
              -Raw

            if ($content.Contains($missingPath)) {
              Write-Host "Removing missing path from $($file.FullName)"

              $content = $content.Replace(
                $missingPath,
                ""
              )

              Set-Content `
                -Path $file.FullName `
                -Value $content `
                -NoNewline
            }
          }

          Write-Host "Finished cleaning missing Skia include paths."

      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ env.ASEPRITE_TAG }}
          path: aseprite
          submodules: recursive
          fetch-depth: 1

      - name: Configure Aseprite
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 exit /b 1

          where cl || exit /b 1
          where cmake || exit /b 1
          where ninja || exit /b 1

          if not exist "%GITHUB_WORKSPACE%\aseprite\CMakeLists.txt" (
            echo Aseprite CMakeLists.txt was not found.
            echo Expected source directory:
            echo %GITHUB_WORKSPACE%\aseprite
            exit /b 1
          )

          if exist "%GITHUB_WORKSPACE%\aseprite\build" (
            rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build"
          )

          cmake ^
            -S "%GITHUB_WORKSPACE%\aseprite" ^
            -B "%GITHUB_WORKSPACE%\aseprite\build" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DLAF_BACKEND=skia ^
            -DENABLE_CCACHE=OFF ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64" ^
            -DSKIA_LIBRARY="%GITHUB_WORKSPACE%\skia\out\Release-x64\skia.lib"

          if errorlevel 1 (
            echo CMake configuration failed.
            exit /b 1
          )

      - name: Build Aseprite
        shell: cmd
        run: |
          cmake ^
            --build "%GITHUB_WORKSPACE%\aseprite\build" ^
            --target aseprite ^
            --parallel

          if errorlevel 1 (
            echo Aseprite build failed.
            exit /b 1
          )

      - name: Create portable configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iniPath = "aseprite\build\bin\aseprite.ini"

          Set-Content `
            -Path $iniPath `
            -Value "# Portable Aseprite configuration"

          if (-not (Test-Path $iniPath)) {
            throw "Portable configuration file was not created."
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executable = "aseprite\build\bin\aseprite.exe"

          if (-not (Test-Path $executable)) {
            throw "Aseprite executable was not created."
          }

          Write-Host "Verified: $executable"

      - name: Create archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binDirectory = "aseprite\build\bin"
          $archiveName = "Aseprite-$env:ASEPRITE_TAG-Windows.zip"
          $archivePath = Join-Path $binDirectory $archiveName
          $stagingDirectory = "$env:RUNNER_TEMP\aseprite-release"

          if (Test-Path $stagingDirectory) {
            Remove-Item `
              -Path $stagingDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stagingDirectory `
            -Force |
            Out-Null

          Get-ChildItem `
            -Path $binDirectory `
            -File |
            Where-Object {
              $_.Name -ne $archiveName
            } |
            Copy-Item `
              -Destination $stagingDirectory `
              -Force

          if (Test-Path $archivePath) {
            Remove-Item `
              -Path $archivePath `
              -Force
          }

          7z a `
            "$archivePath" `
            "$stagingDirectory\*" |
            Out-Null

          if (-not (Test-Path $archivePath)) {
            throw "Release archive was not created."
          }

          Write-Host "Created release archive: $archivePath"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: aseprite/build/bin/Aseprite-${{ env.ASEPRITE_TAG }}-Windows.zip
          if-no-files-found: error
