name: Build Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

  ASEPRITE_TAG: "v1.2.40"
  SKIA_VERSION: "m81-b607b32047"
  SKIA_ARCHIVE: "Skia-Windows-Release-X64.zip"

permissions:
  contents: read

jobs:
  build-aseprite:
    name: Build Aseprite for Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "ninja"
          $zipPath = Join-Path $env:RUNNER_TEMP "ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 300 `
            --output "$zipPath" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja download failed."
          }

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $installDir `
            -Force

          if (-not (Test-Path -LiteralPath (Join-Path $installDir "ninja.exe"))) {
            throw "ninja.exe was not found."
          }

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $installDir

          & (Join-Path $installDir "ninja.exe") --version

      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ env.ASEPRITE_TAG }}
          path: aseprite
          submodules: recursive
          fetch-depth: 1

      - name: Verify Aseprite source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "aseprite"
          $cmakeFile = Join-Path $sourceDir "CMakeLists.txt"

          if (-not (Test-Path -LiteralPath $sourceDir)) {
            throw "Aseprite source directory was not found: $sourceDir"
          }

          if (-not (Test-Path -LiteralPath $cmakeFile)) {
            throw "Aseprite CMakeLists.txt was not found: $cmakeFile"
          }

      - name: Download and verify Skia
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $skiaRoot = Join-Path $env:GITHUB_WORKSPACE "skia"
          $archivePath = Join-Path $env:RUNNER_TEMP $env:SKIA_ARCHIVE
          $downloadUrl = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/$env:SKIA_ARCHIVE"

          if (Test-Path -LiteralPath $skiaRoot) {
            Remove-Item `
              -LiteralPath $skiaRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $skiaRoot `
            -Force |
            Out-Null

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 900 `
            --output "$archivePath" `
            "$downloadUrl"

          if ($LASTEXITCODE -ne 0) {
            throw "Skia download failed."
          }

          7z x "$archivePath" "-o$skiaRoot" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Skia extraction failed."
          }

          $nestedRoot = Join-Path $skiaRoot "skia"

          if (
            (Test-Path -LiteralPath (Join-Path $nestedRoot "include")) -and
            (Test-Path -LiteralPath (Join-Path $nestedRoot "out"))
          ) {
            Get-ChildItem `
              -LiteralPath $nestedRoot `
              -Force |
              Move-Item `
                -Destination $skiaRoot `
                -Force

            Remove-Item `
              -LiteralPath $nestedRoot `
              -Recurse `
              -Force
          }

          $requiredPaths = @(
            (Join-Path $skiaRoot "include"),
            (Join-Path $skiaRoot "out\Release-x64"),
            (Join-Path $skiaRoot "out\Release-x64\skia.lib"),
            (Join-Path $skiaRoot "third_party\externals")
          )

          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Required Skia path is missing: $requiredPath"
            }
          }

          Write-Host "Skia installation verified."

      - name: Configure Aseprite
        shell: cmd
        run: |
          @echo on
          setlocal EnableExtensions EnableDelayedExpansion

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          call "!VSINSTALL!\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize Visual Studio.
            exit /b 1
          )

          where cl
          if errorlevel 1 exit /b 1

          where link
          if errorlevel 1 exit /b 1

          where cmake
          if errorlevel 1 exit /b 1

          where ninja
          if errorlevel 1 exit /b 1

          if exist "%GITHUB_WORKSPACE%\aseprite\build" (
            rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build"
          )

          cmake ^
            -S "%GITHUB_WORKSPACE%\aseprite" ^
            -B "%GITHUB_WORKSPACE%\aseprite\build" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DLAF_BACKEND=skia ^
            -DENABLE_CCACHE=OFF ^
            -DENABLE_OPENSSL=OFF ^
            -DENABLE_LIBMD=OFF ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64" ^
            -DSKIA_LIBRARY="%GITHUB_WORKSPACE%\skia\out\Release-x64\skia.lib" ^
            -Wno-dev ^
            --log-level=VERBOSE

          if errorlevel 1 (
            echo CMake configuration failed.
            exit /b 1
          )

          endlocal

      - name: Upload CMake diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-diagnostics
          path: |
            aseprite/build
          if-no-files-found: warn
          compression-level: 6

      - name: Build Aseprite
        shell: cmd
        run: |
          @echo on
          setlocal EnableExtensions EnableDelayedExpansion

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          call "!VSINSTALL!\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize Visual Studio.
            exit /b 1
          )

          where cl
          if errorlevel 1 exit /b 1

          where link
          if errorlevel 1 exit /b 1

          where cmake
          if errorlevel 1 exit /b 1

          where ninja
          if errorlevel 1 exit /b 1

          if not exist "%GITHUB_WORKSPACE%\aseprite\build\build.ninja" (
            echo build.ninja was not found.
            echo CMake configuration did not generate a build system.
            exit /b 1
          )

          cmake ^
            --build "%GITHUB_WORKSPACE%\aseprite\build" ^
            --target aseprite ^
            --parallel 2 ^
            --verbose

          if errorlevel 1 (
            echo Aseprite build failed.
            exit /b 1
          )

          endlocal

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executable = Join-Path `
            $env:GITHUB_WORKSPACE `
            "aseprite\build\bin\aseprite.exe"

          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Aseprite executable was not created: $executable"
          }

          Write-Host "Verified executable:"
          Write-Host $executable

      - name: Upload uncompressed build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-build-output
          path: |
            aseprite/build/bin
          if-no-files-found: warn
          compression-level: 0
