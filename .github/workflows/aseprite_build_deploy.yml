name: Build and deploy Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

  # This Skia package must match the Aseprite source version being built.
  SKIA_VERSION: "m81-b607b32047"
  SKIA_ARCHIVE: "Skia-Windows-Release-X64.zip"

permissions:
  contents: write

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      version_info: ${{ steps.version_info.outputs.version_info }}

    steps:
      - name: Get latest Aseprite release information
        id: version_info
        shell: bash
        run: |
          set -euo pipefail

          data="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aseprite/aseprite/releases/latest")"

          latest_tag="$(jq -r '.tag_name' <<< "$data")"
          version_info="$(jq -r '.body // ""' <<< "$data")"

          {
            echo "latest_tag=$latest_tag"
            echo "version_info<<EOF"
            echo "$version_info"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-aseprite:
    name: Build Aseprite for Windows
    needs: check-version
    runs-on: windows-latest

    steps:
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "ninja"
          $zipPath = Join-Path $env:RUNNER_TEMP "ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip"

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

          Add-Content -Path $env:GITHUB_PATH -Value $installDir

          & (Join-Path $installDir "ninja.exe") --version

      - name: Restore Skia cache
        id: skia_cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-x64-${{ env.SKIA_VERSION }}-v2

      - name: Download and verify Skia
        shell: pwsh
        env:
          SKIA_CACHE_HIT: ${{ steps.skia_cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"

          $skiaRoot = Join-Path $env:GITHUB_WORKSPACE "skia"
          $skiaDependency = Join-Path $skiaRoot "third_party\externals\libjpeg-turbo"
          $skiaLibraryDir = Join-Path $skiaRoot "out\Release-x64"
          $skiaLibrary = Join-Path $skiaLibraryDir "skia.lib"

          if ($env:SKIA_CACHE_HIT -ne "true") {
            $archive = Join-Path $env:RUNNER_TEMP $env:SKIA_ARCHIVE
            $downloadUrl = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/$env:SKIA_ARCHIVE"

            if (Test-Path $skiaRoot) {
              Remove-Item $skiaRoot -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $skiaRoot | Out-Null

            Write-Host "Downloading Skia from $downloadUrl"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive

            7z x $archive "-o$skiaRoot" -y | Out-Null

            # Some archives contain a single top-level directory.
            $nestedSkia = Join-Path $skiaRoot "skia"

            if (
              (Test-Path (Join-Path $nestedSkia "include")) -and
              (Test-Path (Join-Path $nestedSkia "out"))
            ) {
              Write-Host "Flattening nested Skia directory."
              Get-ChildItem -LiteralPath $nestedSkia -Force |
                Move-Item -Destination $skiaRoot -Force

              Remove-Item $nestedSkia -Recurse -Force
            }
          }
          else {
            Write-Host "Skia was restored from cache."
          }

          $requiredPaths = @(
            $skiaRoot,
            (Join-Path $skiaRoot "include"),
            (Join-Path $skiaRoot "third_party"),
            $skiaDependency,
            $skiaLibraryDir,
            $skiaLibrary
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              Write-Host "Skia directory contents:"
              if (Test-Path $skiaRoot) {
                Get-ChildItem $skiaRoot -Recurse -Depth 3 |
                  Select-Object FullName
              }

              throw "Required Skia path is missing: $path"
            }
          }

          Write-Host "Skia verified successfully."
          Write-Host "SKIA_DIR: $skiaRoot"
          Write-Host "SKIA_LIBRARY_DIR: $skiaLibraryDir"
          Write-Host "SKIA_LIBRARY: $skiaLibrary"

      - name: Checkout Aseprite source with submodules
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check-version.outputs.latest_tag }}
          submodules: recursive
          path: aseprite
          fetch-depth: 1

      - name: Verify Aseprite source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "aseprite"

          if (-not (Test-Path (Join-Path $sourceRoot "CMakeLists.txt"))) {
            throw "Aseprite CMakeLists.txt was not found."
          }

          if (-not (Test-Path (Join-Path $sourceRoot "laf\cmake\c_flag_overrides.cmake"))) {
            throw "The laf submodule was not checked out correctly."
          }

          if (-not (Test-Path (Join-Path $sourceRoot "laf\cmake\cxx_flag_overrides.cmake"))) {
            throw "The laf CMake files were not found."
          }

          Write-Host "Aseprite source and submodules verified."

      - name: Configure Aseprite
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize the Visual Studio environment.
            exit /b 1
          )

          where cl || exit /b 1
          where cmake || exit /b 1
          where ninja || exit /b 1

          if exist "%GITHUB_WORKSPACE%\aseprite\build" (
            rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build"
          )

          cmake ^
            -S "%GITHUB_WORKSPACE%\aseprite" ^
            -B "%GITHUB_WORKSPACE%\aseprite\build" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DLAF_BACKEND=skia ^
            -DENABLE_CCACHE=OFF ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64" ^
            -DSKIA_LIBRARY="%GITHUB_WORKSPACE%\skia\out\Release-x64\skia.lib"

          if errorlevel 1 (
            echo CMake configuration failed.
            exit /b 1
          )

      - name: Build Aseprite
        shell: cmd
        run: |
          cmake ^
            --build "%GITHUB_WORKSPACE%\aseprite\build" ^
            --target aseprite ^
            --parallel

          if errorlevel 1 (
            echo Aseprite build failed.
            exit /b 1
          )

      - name: Clean generated build files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binPath = Join-Path $env:GITHUB_WORKSPACE "aseprite\build\bin"

          $filesToRemove = @(
            "gen",
            "gen.exe",
            "gen.exe.manifest",
            "modp_b64_gen",
            "modp_b64_gen.exe",
            "modp_b64_gen.exe.manifest"
          )

          foreach ($file in $filesToRemove) {
            $path = Join-Path $binPath $file

            if (Test-Path $path) {
              Remove-Item $path -Force
            }
          }

      - name: Make Aseprite portable
        shell: pwsh
        run: |
          Set-Content `
            -Path "aseprite\build\bin\aseprite.ini" `
            -Value "# This file is here so Aseprite behaves as a portable program"

      - name: Verify build output
        shell: pwsh
        run: |
          $executable = "aseprite\build\bin\aseprite.exe"

          if (-not (Test-Path $executable)) {
            throw "Aseprite executable was not found at $executable"
          }

          Write-Host "Build output verified: $executable"

      - name: Create release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.check-version.outputs.latest_tag }}"
          $archiveName = "Aseprite-$tag-Windows.zip"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "aseprite\build\bin\$archiveName"

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          7z a $archivePath "aseprite\build\bin\*" | Out-Null

          if (-not (Test-Path $archivePath)) {
            throw "Release archive was not created."
          }

          Write-Host "Created release archive: $archivePath"

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ needs.check-version.outputs.latest_tag }}"

          cat > release-notes.md <<'EOF'
          ${{ needs.check-version.outputs.version_info }}
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Release Aseprite $tag" \
              --notes-file release-notes.md
          fi

      - name: Upload release archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ needs.check-version.outputs.latest_tag }}"
          archive="aseprite/build/bin/Aseprite-$tag-Windows.zip"

          test -f "$archive"

          gh release upload "$tag" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
