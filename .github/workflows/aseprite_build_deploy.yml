name: Build and deploy Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

env:
  BUILD_TYPE: Release
  NINJA_VERSION: "1.12.1"

  # This must match the Aseprite source revision being built.
  SKIA_VERSION: "m81-b607b32047"
  SKIA_ARCHIVE: "Skia-Windows-Release-X64.zip"

permissions:
  contents: write

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      version_info: ${{ steps.version_info.outputs.version_info }}

    steps:
      - name: Get latest Aseprite release information
        id: version_info
        shell: bash
        run: |
          set -euo pipefail

          data="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aseprite/aseprite/releases/latest")"

          latest_tag="$(jq -r '.tag_name' <<< "$data")"
          version_info="$(jq -r '.body // ""' <<< "$data")"

          {
            echo "latest_tag=$latest_tag"
            echo "version_info<<EOF"
            echo "$version_info"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-aseprite:
    name: Build Aseprite for Windows
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "ninja"
          $zipPath = Join-Path $env:RUNNER_TEMP "ninja.zip"
          $url = "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip"

          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          Write-Host "Downloading Ninja from $url"

          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            --max-time 300 `
            --output "$zipPath" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja download failed with exit code $LASTEXITCODE"
          }

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $installDir `
            -Force

          $ninja = Join-Path $installDir "ninja.exe"

          if (-not (Test-Path $ninja)) {
            throw "ninja.exe was not found after extraction."
          }

          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $installDir

          & $ninja --version

      - name: Restore Skia cache
        id: skia_cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-x64-${{ env.SKIA_VERSION }}-v4

      - name: Download and verify Skia
        shell: pwsh
        env:
          SKIA_CACHE_HIT: ${{ steps.skia_cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"

          $skiaRoot = Join-Path $env:GITHUB_WORKSPACE "skia"
          $archive = Join-Path $env:RUNNER_TEMP $env:SKIA_ARCHIVE
          $url = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/$env:SKIA_ARCHIVE"

          if ($env:SKIA_CACHE_HIT -ne "true") {
            if (Test-Path $skiaRoot) {
              Remove-Item $skiaRoot -Recurse -Force
            }

            New-Item `
              -ItemType Directory `
              -Path $skiaRoot `
              -Force |
              Out-Null

            Write-Host "Downloading Skia from $url"

            curl.exe `
              --fail `
              --location `
              --retry 5 `
              --retry-delay 3 `
              --connect-timeout 30 `
              --max-time 900 `
              --output "$archive" `
              "$url"

            if ($LASTEXITCODE -ne 0) {
              throw "Skia download failed with exit code $LASTEXITCODE"
            }

            if (-not (Test-Path $archive)) {
              throw "Skia archive was not downloaded."
            }

            Write-Host "Skia archive contents:"
            7z l "$archive"

            7z x "$archive" "-o$skiaRoot" -y | Out-Null
          }
          else {
            Write-Host "Skia was restored from cache."
          }

          $nestedRoot = Join-Path $skiaRoot "skia"

          if (
            (Test-Path (Join-Path $nestedRoot "include")) -and
            (Test-Path (Join-Path $nestedRoot "out"))
          ) {
            Write-Host "Flattening nested Skia directory."

            Get-ChildItem `
              -LiteralPath $nestedRoot `
              -Force |
              Move-Item `
                -Destination $skiaRoot `
                -Force

            Remove-Item $nestedRoot -Recurse -Force
          }

          $requiredPaths = @(
            (Join-Path $skiaRoot "include"),
            (Join-Path $skiaRoot "out"),
            (Join-Path $skiaRoot "out\Release-x64"),
            (Join-Path $skiaRoot "out\Release-x64\skia.lib"),
            (Join-Path $skiaRoot "third_party"),
            (Join-Path $skiaRoot "third_party\externals"),
            (Join-Path $skiaRoot "third_party\externals\libjpeg-turbo")
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              Write-Host "Extracted Skia directory:"
              Get-ChildItem `
                -LiteralPath $skiaRoot `
                -Recurse `
                -Depth 5 |
                Select-Object FullName

              throw "Required Skia path is missing: $path"
            }
          }

          Write-Host "Skia installation verified."

      - name: Checkout Aseprite source
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check-version.outputs.latest_tag }}
          submodules: recursive
          path: aseprite
          fetch-depth: 1

      - name: Verify Aseprite source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "aseprite"

          $requiredFiles = @(
            "CMakeLists.txt",
            "laf\cmake\c_flag_overrides.cmake",
            "laf\cmake\cxx_flag_overrides.cmake"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $sourceRoot $file

            if (-not (Test-Path $path)) {
              throw "Required Aseprite file is missing: $path"
            }
          }

          Write-Host "Aseprite source and submodules verified."

      - name: Configure Aseprite
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          set "VSINSTALL="

          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALL=%%i"
          )

          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )

          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64

          if errorlevel 1 (
            echo Failed to initialize the Visual Studio environment.
            exit /b 1
          )

          where cl || exit /b 1
          where cmake || exit /b 1
          where ninja || exit /b 1

          if exist "%GITHUB_WORKSPACE%\aseprite\build" (
            rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build"
          )

          cmake ^
            -S "%GITHUB_WORKSPACE%\aseprite" ^
            -B "%GITHUB_WORKSPACE%\aseprite\build" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DLAF_BACKEND=skia ^
            -DENABLE_CCACHE=OFF ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64" ^
            -DSKIA_LIBRARY="%GITHUB_WORKSPACE%\skia\out\Release-x64\skia.lib"

          if errorlevel 1 (
            echo CMake configuration failed.
            exit /b 1
          )

          if not exist "%GITHUB_WORKSPACE%\aseprite\build\build.ninja" (
            echo build.ninja was not created.
            exit /b 1
          )

      - name: Build Aseprite
        shell: cmd
        run: |
          cmake ^
            --build "%GITHUB_WORKSPACE%\aseprite\build" ^
            --target aseprite ^
            --parallel

          if errorlevel 1 (
            echo Aseprite build failed.
            exit /b 1
          )

      - name: Clean generated files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "aseprite\build\bin"

          $files = @(
            "gen",
            "gen.exe",
            "gen.exe.manifest",
            "modp_b64_gen",
            "modp_b64_gen.exe",
            "modp_b64_gen.exe.manifest"
          )

          foreach ($file in $files) {
            $path = Join-Path $binPath $file

            if (Test-Path $path) {
              Remove-Item $path -Force
            }
          }

      - name: Make Aseprite portable
        shell: pwsh
        run: |
          Set-Content `
            -Path "aseprite\build\bin\aseprite.ini" `
            -Value "# This file is here so Aseprite behaves as a portable program"

      - name: Verify build output
        shell: pwsh
        run: |
          $executable = "aseprite\build\bin\aseprite.exe"

          if (-not (Test-Path $executable)) {
            throw "Aseprite executable was not found at $executable"
          }

          Write-Host "Build output verified: $executable"

      - name: Create release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.check-version.outputs.latest_tag }}"
          $archiveName = "Aseprite-$tag-Windows.zip"
          $archivePath = "aseprite\build\bin\$archiveName"

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          7z a `
            $archivePath `
            "aseprite\build\bin\*" |
            Out-Null

          if (-not (Test-Path $archivePath)) {
            throw "Release archive was not created."
          }

          Write-Host "Created release archive: $archivePath"

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ needs.check-version.outputs.latest_tag }}"

          cat > release-notes.md <<'EOF'
          ${{ needs.check-version.outputs.version_info }}
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Release Aseprite $tag" \
              --notes-file release-notes.md
          fi

      - name: Upload release archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ needs.check-version.outputs.latest_tag }}"
          archive="aseprite/build/bin/Aseprite-$tag-Windows.zip"

          if [ ! -f "$archive" ]; then
            echo "Release archive not found: $archive"
            exit 1
          fi

          gh release upload "$tag" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
